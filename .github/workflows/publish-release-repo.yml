name: Publish signed APK

on:
  push:
    branches: [main, beta]
    paths:
      - "app/**"
      - "scripts/update-version-json.ps1"
      - "version.properties"
      - "updates/**"
      - ".github/workflows/publish-release-repo.yml"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      RELEASES_REPO: msalcedofernand-afk/sales-network-app-releases
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      BETA_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Falta ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Falta ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Falta ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Select channel
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "task=assembleStableRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/stable/release/app-stable-release.apk" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "task=assembleBetaRelease" >> "$GITHUB_OUTPUT"
            echo "apk=app/build/outputs/apk/beta/release/app-beta-release.apk" >> "$GITHUB_OUTPUT"
            echo "branch=beta" >> "$GITHUB_OUTPUT"
          fi
          base_version=$(awk -F= '$1 == "versionName" { print $2 }' version.properties)
          if [ "$GITHUB_REF_NAME" = "beta" ]; then
            channel_name="beta"
            artifact_code=$((450000 + GITHUB_RUN_NUMBER))
            artifact_version="${base_version}-beta.${GITHUB_RUN_NUMBER}"
          else
            channel_name="stable"
            artifact_code=$(awk -F= '$1 == "versionCode" { print $2 }' version.properties)
            artifact_version="$base_version"
          fi
          artifact_name="sales-network-${channel_name}-v${artifact_version}-code${artifact_code}.apk"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact-code=$artifact_code" >> "$GITHUB_OUTPUT"
      - name: Build signed release
        run: ./gradlew :app:${{ steps.release.outputs.task }}
      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs "${{ steps.release.outputs.apk }}"
      - name: Generate manifest from APK
        shell: pwsh
        run: |
          $channel = '${{ steps.release.outputs.channel }}'
          $version = (Get-Content version.properties | Where-Object { $_ -like 'versionName=*' }).Split('=', 2)[1]
          $code = [int]((Get-Content version.properties | Where-Object { $_ -like 'versionCode=*' }).Split('=', 2)[1])
          if ($channel -eq 'beta') {
            $code = 450000 + [int]$env:GITHUB_RUN_NUMBER
            $version = "$version-beta.$env:GITHUB_RUN_NUMBER"
          }
          ./scripts/update-version-json.ps1 -Channel $channel -ApkPath '${{ steps.release.outputs.apk }}' -OutputPath "generated/$channel.json" -VersionCode $code -VersionName $version -ApkName '${{ steps.release.outputs.artifact-name }}' -ReleaseNotes @('Sesión y actualizaciones reforzadas.', 'Invitaciones y caché segura corregidas.')
      - name: Publish artifact and generated manifest
        env:
          RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          test -n "$RELEASES_REPO_TOKEN" || { echo "Falta RELEASES_REPO_TOKEN"; exit 1; }
          git clone --branch "${{ steps.release.outputs.branch }}" "https://x-access-token:${RELEASES_REPO_TOKEN}@github.com/${RELEASES_REPO}.git" release-repo
          mkdir -p release-repo/releases release-repo/updates
          cp "${{ steps.release.outputs.apk }}" "release-repo/releases/${{ steps.release.outputs.artifact-name }}"
          cp "${{ steps.release.outputs.apk }}" "release-repo/releases/sales-network-${{ steps.release.outputs.channel }}.apk"
          cp "generated/${{ steps.release.outputs.channel }}.json" "release-repo/updates/${{ steps.release.outputs.channel }}.json"
          cd release-repo
          git config user.name "sales-network-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases updates
          git commit -m "release(${{ steps.release.outputs.channel }}): code ${{ steps.release.outputs.artifact-code }} ${GITHUB_SHA::7}" || exit 0
          git push origin "HEAD:${{ steps.release.outputs.branch }}"
